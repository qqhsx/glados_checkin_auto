name: Auto Sign-in for BBS

on:
  schedule:
    - cron: '20 23 * * *'
  workflow_dispatch:

jobs:
  sign_in_job:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          pip install requests
          # 安装自定义 wx_msg 模块
          pip install git+https://github.com/qqhsx/my-utils.git

      - name: Run sign-in script
        env:
          GLADOS_COOKIES: ${{ secrets.GLADOS_COOKIES }}
          WX_CORPID: ${{ secrets.WX_CORPID }}
          WX_CORPSECRET: ${{ secrets.WX_CORPSECRET }}
          WX_AGENTID: ${{ secrets.WX_AGENTID }}
        run: python glados_checkin_auto.py
